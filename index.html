<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Família Coelho" />
  <title>Família Coelho</title>
  <link rel="manifest" href="./manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f6fa;
      --card: #ffffff;
      --text: #1a1a2e;
      --text2: #6b7280;
      --border: #e5e7eb;
      --green: #10b981;
      --green-bg: #ecfdf5;
      --red: #ef4444;
      --red-bg: #fef2f2;
      --orange: #f59e0b;
      --orange-bg: #fffbeb;
      --blue: #3b82f6;
      --blue-bg: #eff6ff;
      --shadow: 0 2px 12px rgba(0,0,0,0.07);
      --radius: 14px;
      --nav-h: 68px;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: calc(var(--nav-h) + 16px);
    }

    /* ===== HEADER ===== */
    .header {
      background: var(--card);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-title { font-size: 18px; font-weight: 700; }
    .header-title span { color: var(--blue); }
    .month-nav { display: flex; align-items: center; gap: 12px; }
    .month-nav button {
      background: none; border: none; cursor: pointer;
      font-size: 20px; color: var(--text2); padding: 4px 8px;
      border-radius: 8px; transition: background .2s;
    }
    .month-nav button:hover { background: var(--border); }
    .month-label { font-size: 15px; font-weight: 600; min-width: 110px; text-align: center; }

    /* ===== MAIN ===== */
    .main { padding: 20px 16px; max-width: 600px; margin: 0 auto; }

    /* ===== CARDS RESUMO ===== */
    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .summary-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .summary-card.full { grid-column: 1 / -1; }
    .summary-card .label {
      font-size: 12px; font-weight: 500;
      color: var(--text2); text-transform: uppercase;
      letter-spacing: .5px; margin-bottom: 6px;
    }
    .summary-card .value {
      font-size: 22px; font-weight: 700;
    }
    .summary-card .value.green { color: var(--green); }
    .summary-card .value.red { color: var(--red); }
    .summary-card .value.blue { color: var(--blue); }
    .summary-card .value.orange { color: var(--orange); }
    .summary-card .sub {
      font-size: 12px; color: var(--text2); margin-top: 4px;
    }

    /* ===== BARRA DE PROGRESSO ===== */
    .progress-bar {
      background: var(--border); border-radius: 99px;
      height: 8px; margin-top: 10px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; border-radius: 99px;
      background: linear-gradient(90deg, var(--green), var(--blue));
      transition: width .5s ease;
    }

    /* ===== SECTION ===== */
    .section { margin-bottom: 20px; }
    .section-header {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 12px;
    }
    .section-title {
      font-size: 15px; font-weight: 700;
      display: flex; align-items: center; gap: 8px;
    }
    .badge {
      background: var(--red); color: #fff;
      font-size: 11px; font-weight: 600;
      padding: 2px 7px; border-radius: 99px;
    }
    .badge.orange { background: var(--orange); }
    .btn-add {
      background: var(--blue); color: #fff;
      border: none; border-radius: 99px;
      padding: 6px 14px; font-size: 13px;
      font-weight: 600; cursor: pointer;
      font-family: 'Poppins', sans-serif;
      transition: opacity .2s;
    }
    .btn-add:hover { opacity: .85; }

    /* ===== ITEM CARD ===== */
    .item-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: transform .15s;
    }
    .item-card:active { transform: scale(.98); }

    .item-check {
      width: 24px; height: 24px; flex-shrink: 0;
      border: 2px solid var(--border);
      border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s;
    }
    .item-check.checked {
      background: var(--green); border-color: var(--green);
    }
    .item-check.checked::after {
      content: '✓'; color: #fff; font-size: 13px; font-weight: 700;
    }

    .item-info { flex: 1; min-width: 0; }
    .item-name {
      font-size: 14px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .item-name.paid { text-decoration: line-through; color: var(--text2); }
    .item-meta {
      font-size: 12px; color: var(--text2); margin-top: 2px;
    }
    .item-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
    .tag {
      font-size: 11px; font-weight: 500;
      padding: 2px 8px; border-radius: 99px;
    }
    .tag.fixo { background: var(--blue-bg); color: var(--blue); }
    .tag.parcelado { background: var(--orange-bg); color: var(--orange); }
    .tag.esporadico { background: #f3f4f6; color: var(--text2); }
    .tag.atrasado { background: var(--red-bg); color: var(--red); }

    .item-value {
      font-size: 15px; font-weight: 700;
      flex-shrink: 0; text-align: right;
    }
    .item-value.paid { color: var(--text2); font-weight: 500; }

    .item-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .btn-icon {
      background: none; border: none; cursor: pointer;
      font-size: 16px; padding: 4px; border-radius: 8px;
      transition: background .2s;
    }
    .btn-icon:hover { background: var(--border); }

    /* ===== EMPTY STATE ===== */
    .empty {
      text-align: center; padding: 40px 20px;
      color: var(--text2); font-size: 14px;
    }
    .empty .icon { font-size: 40px; margin-bottom: 10px; }

    /* ===== BOTTOM NAV ===== */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex; height: var(--nav-h);
      z-index: 200;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
    }
    .nav-item {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 4px; cursor: pointer; border: none;
      background: none; font-family: 'Poppins', sans-serif;
      font-size: 11px; font-weight: 500; color: var(--text2);
      transition: color .2s; padding: 8px 0;
    }
    .nav-item .icon { font-size: 22px; }
    .nav-item.active { color: var(--blue); }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 300; display: none;
      align-items: flex-end; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--card);
      border-radius: 24px 24px 0 0;
      padding: 24px 20px 40px;
      width: 100%; max-width: 600px;
      max-height: 90vh; overflow-y: auto;
      animation: slideUp .3s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-title {
      font-size: 18px; font-weight: 700;
      margin-bottom: 20px; text-align: center;
    }

    /* ===== FORM ===== */
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block; font-size: 13px; font-weight: 600;
      margin-bottom: 6px; color: var(--text2);
    }
    .form-input, .form-select {
      width: 100%; padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px; font-size: 15px;
      font-family: 'Poppins', sans-serif;
      background: var(--bg); color: var(--text);
      transition: border-color .2s;
      appearance: none;
    }
    .form-input:focus, .form-select:focus {
      outline: none; border-color: var(--blue);
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .tipo-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .tipo-btn {
      flex: 1; min-width: 80px; padding: 10px 8px;
      border: 1.5px solid var(--border); border-radius: 10px;
      background: none; cursor: pointer; font-family: 'Poppins', sans-serif;
      font-size: 12px; font-weight: 500; text-align: center;
      transition: all .2s;
    }
    .tipo-btn.active {
      border-color: var(--blue); background: var(--blue-bg); color: var(--blue);
    }
    .conditional { display: none; }
    .conditional.show { display: block; }

    .btn-salvar {
      width: 100%; padding: 14px;
      background: var(--blue); color: #fff;
      border: none; border-radius: 12px;
      font-size: 16px; font-weight: 700;
      font-family: 'Poppins', sans-serif;
      cursor: pointer; margin-top: 8px;
      transition: opacity .2s;
    }
    .btn-salvar:hover { opacity: .9; }
    .btn-cancelar {
      width: 100%; padding: 12px;
      background: none; color: var(--text2);
      border: none; font-size: 14px;
      font-family: 'Poppins', sans-serif;
      cursor: pointer; margin-top: 6px;
    }

    /* ===== TABS ===== */
    .tabs {
      display: flex; gap: 8px; margin-bottom: 16px;
      overflow-x: auto; padding-bottom: 4px;
    }
    .tab {
      padding: 8px 16px; border-radius: 99px;
      border: 1.5px solid var(--border);
      background: none; cursor: pointer;
      font-family: 'Poppins', sans-serif;
      font-size: 13px; font-weight: 500;
      white-space: nowrap; transition: all .2s;
    }
    .tab.active {
      background: var(--blue); border-color: var(--blue); color: #fff;
    }

    /* ===== ALERTA ATRASADO ===== */
    .alert-banner {
      background: var(--red-bg);
      border: 1px solid #fca5a5;
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-bottom: 16px;
      font-size: 13px; color: var(--red);
      font-weight: 500;
    }

    /* ===== PAGES ===== */
    .page { display: none; }
    .page.active { display: block; }

    /* ===== LOADING ===== */
    .loading {
      text-align: center; padding: 40px;
      color: var(--text2); font-size: 14px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== ENTRADA CARD ===== */
    .entrada-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .entrada-icon {
      width: 40px; height: 40px;
      border-radius: 50%; background: var(--green-bg);
      display: flex; align-items: center;
      justify-content: center; font-size: 18px;
      flex-shrink: 0;
    }
    .entrada-icon.saida { background: var(--red-bg); }

    /* Scrollbar hide */
    .tabs::-webkit-scrollbar { display: none; }
    /* ===== BOTÃO FLUTUANTE ===== */
    .fab {
      position: fixed;
      bottom: calc(var(--nav-h) + 16px);
      right: 20px;
      width: 56px; height: 56px;
      background: var(--blue);
      color: #fff;
      border: none; border-radius: 50%;
      font-size: 28px; font-weight: 300;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(59,130,246,0.45);
      display: none;
      align-items: center; justify-content: center;
      z-index: 150;
      transition: transform .2s, box-shadow .2s;
    }
    .fab:active { transform: scale(.93); box-shadow: 0 2px 8px rgba(59,130,246,0.3); }
    .fab.visible { display: flex; }
  </style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div class="modal-overlay open" id="tela-login" style="align-items:center;background:var(--bg)">
  <div class="modal" style="border-radius:24px;max-width:340px">
    <div class="modal-title">🐇 Família Coelho</div>
    <div class="form-group">
      <label class="form-label">E-mail</label>
      <input class="form-input" id="login-email" type="email" placeholder="seuemail@exemplo.com" />
    </div>
    <div class="form-group">
      <label class="form-label">Senha</label>
      <input class="form-input" id="login-senha" type="password" placeholder="••••••••" />
    </div>
    <div id="login-erro" style="color:var(--red);font-size:13px;margin-bottom:10px;display:none"></div>
    <button class="btn-salvar" id="login-btn" onclick="fazerLogin()">Entrar</button>

    <div style="text-align:center;color:var(--text2);font-size:12px;margin:14px 0">ou</div>

    <button class="btn-salvar" id="login-google-btn" onclick="fazerLoginGoogle()"
      style="background:#fff;color:var(--text);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;gap:10px">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03l2.97-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.97l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      Entrar com Google
    </button>
  </div>
</div>

<!-- APP (fica escondido até logar) -->
<div id="app-root" style="display:none">

<!-- HEADER -->
<div class="header">
  <div class="header-title">Família <span>Coelho</span></div>
  <div class="month-nav">
    <button onclick="mudarMes(-1)">‹</button>
    <div class="month-label" id="monthLabel"></div>
    <button onclick="mudarMes(1)">›</button>
    <button onclick="fazerLogout()" title="Sair" style="font-size:16px">🚪</button>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- PAGE: DASHBOARD -->
  <div class="page active" id="page-home">
    <div id="home-content">
      <div class="loading"><div class="spinner"></div>Carregando...</div>
    </div>
  </div>

  <!-- PAGE: CONTAS -->
  <div class="page" id="page-contas">
    <div class="section-header">
      <div class="section-title">Contas a Pagar</div>
      <button class="btn-add" onclick="abrirModal('conta')">+ Nova</button>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="filtrarContas('todas', this)">Todas</button>
      <button class="tab" onclick="filtrarContas('pendente', this)">Pendentes</button>
      <button class="tab" onclick="filtrarContas('pago', this)">Pagas</button>
      <button class="tab" onclick="filtrarContas('atrasado', this)">Atrasadas</button>
    </div>
    <div id="contas-content">
      <div class="loading"><div class="spinner"></div>Carregando...</div>
    </div>
  </div>

  <!-- PAGE: ENTRADAS/SAÍDAS -->
  <div class="page" id="page-lancamentos">
    <div class="section-header">
      <div class="section-title">Lançamentos</div>
      <button class="btn-add" onclick="abrirModal('lancamento')">+ Novo</button>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="filtrarLancamentos('todos', this)">Todos</button>
      <button class="tab" onclick="filtrarLancamentos('entrada', this)">Entradas</button>
      <button class="tab" onclick="filtrarLancamentos('saida', this)">Saídas</button>
    </div>
    <div id="lancamentos-content">
      <div class="loading"><div class="spinner"></div>Carregando...</div>
    </div>
  </div>

  <!-- PAGE: ANÁLISE -->
  <div class="page" id="page-analise">
    <div id="analise-content">
      <div class="loading"><div class="spinner"></div>Carregando...</div>
    </div>
  </div>

</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-item active" onclick="showPage('home', this)">
    <span class="icon">⌂</span>Dashboard
  </button>
  <button class="nav-item" onclick="showPage('contas', this)">
    <span class="icon">≡</span>Contas
  </button>
  <button class="nav-item" onclick="showPage('lancamentos', this)">
    <span class="icon">±</span>Lançamentos
  </button>
  <button class="nav-item" onclick="showPage('analise', this)">
    <span class="icon">◑</span>Análise
  </button>
</nav>

<!-- MODAL CONTA -->
<div class="modal-overlay" id="modal-conta">
  <div class="modal">
    <div class="modal-title" id="modal-conta-title">Nova Conta a Pagar</div>
    <input type="hidden" id="conta-id" />

    <div class="form-group">
      <label class="form-label">Nome / Descrição</label>
      <input class="form-input" id="conta-nome" placeholder="Ex: Aluguel, Internet..." />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Valor (R$)</label>
        <input class="form-input" id="conta-valor" type="number" step="0.01" placeholder="0,00" />
      </div>
      <div class="form-group">
        <label class="form-label">Categoria</label>
        <select class="form-select" id="conta-categoria">
          <option value="moradia">🏠 Moradia</option>
          <option value="alimentacao">🍔 Alimentação</option>
          <option value="saude">💊 Saúde</option>
          <option value="transporte">🚗 Transporte</option>
          <option value="educacao">📚 Educação</option>
          <option value="lazer">🎮 Lazer</option>
          <option value="servicos">📱 Serviços</option>
          <option value="emprestimo">💰 Empréstimo</option>
          <option value="cartao">💳 Cartão</option>
          <option value="outros">📦 Outros</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Tipo de Conta</label>
      <div class="tipo-group">
        <button class="tipo-btn active" onclick="selecionarTipo('fixa', this)">📅 Fixa</button>
        <button class="tipo-btn" onclick="selecionarTipo('parcelada', this)">🔢 Parcelada</button>
        <button class="tipo-btn" onclick="selecionarTipo('esporadica', this)">📌 Esporádica</button>
      </div>
    </div>

    <div class="conditional show" id="cond-fixa">
      <div class="form-group">
        <label class="form-label">Dia do vencimento</label>
        <input class="form-input" id="conta-dia" type="number" min="1" max="31" placeholder="Ex: 10" />
      </div>
    </div>

    <div class="conditional" id="cond-parcelada">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Parcela atual</label>
          <input class="form-input" id="conta-parcela-atual" type="number" min="1" placeholder="Ex: 3" />
        </div>
        <div class="form-group">
          <label class="form-label">Total de parcelas</label>
          <input class="form-input" id="conta-total-parcelas" type="number" min="1" placeholder="Ex: 12" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Dia do vencimento</label>
        <input class="form-input" id="conta-dia-parcela" type="number" min="1" max="31" placeholder="Ex: 15" />
      </div>
    </div>

    <div class="conditional" id="cond-esporadica">
      <div class="form-group">
        <label class="form-label">Data de vencimento</label>
        <input class="form-input" id="conta-data-venc" type="date" />
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Observação (opcional)</label>
      <input class="form-input" id="conta-obs" placeholder="Alguma observação..." />
    </div>

    <button class="btn-salvar" onclick="salvarConta()">Salvar Conta</button>
    <button class="btn-cancelar" onclick="fecharModal('conta')">Cancelar</button>
  </div>
</div>

<!-- MODAL LANÇAMENTO -->
<div class="modal-overlay" id="modal-lancamento">
  <div class="modal">
    <div class="modal-title" id="modal-lanc-title">Novo Lançamento</div>
    <input type="hidden" id="lanc-id" />

    <div class="form-group">
      <label class="form-label">Tipo</label>
      <div class="tipo-group">
        <button class="tipo-btn active" style="border-color: var(--green); background: var(--green-bg); color: var(--green);" onclick="selecionarTipoLanc('entrada', this)">⬆️ Entrada</button>
        <button class="tipo-btn" onclick="selecionarTipoLanc('saida', this)">⬇️ Saída</button>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Descrição</label>
      <input class="form-input" id="lanc-desc" placeholder="Ex: Salário, Mercado..." />
    </div>

<!-- FIREBASE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, push, get, remove, update, onValue }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
  import { getAuth, signInWithEmailAndPassword, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged, signOut }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAS0SbhQt5b6U7yHmKG34UGdZpL7hDzk-8",
    authDomain: "dashboard-financeiro-72a95.firebaseapp.com",
    databaseURL: "https://dashboard-financeiro-72a95-default-rtdb.firebaseio.com",
    projectId: "dashboard-financeiro-72a95",
    storageBucket: "dashboard-financeiro-72a95.firebasestorage.app",
    messagingSenderId: "91078669164",
    appId: "1:91078669164:web:9df31af305a09a94b63949"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);

  // ===== LOGIN =====
  window.fazerLogin = async () => {
    const email = document.getElementById('login-email').value.trim();
    const senha = document.getElementById('login-senha').value;
    const erroEl = document.getElementById('login-erro');
    const btn = document.getElementById('login-btn');
    erroEl.style.display = 'none';
    if (!email || !senha) {
      erroEl.textContent = 'Preencha e-mail e senha.';
      erroEl.style.display = 'block';
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Entrando...';
    try {
      await signInWithEmailAndPassword(auth, email, senha);
    } catch (e) {
      console.error('Erro login e-mail/senha:', e);
      erroEl.textContent = 'Erro: ' + (e.code || e.message);
      erroEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  };

  // Permite logar apertando Enter no campo de senha
  document.addEventListener('DOMContentLoaded', () => {
    const senhaEl = document.getElementById('login-senha');
    if (senhaEl) senhaEl.addEventListener('keydown', e => { if (e.key === 'Enter') fazerLogin(); });
  });

  window.fazerLoginGoogle = async () => {
    const provider = new GoogleAuthProvider();
    await signInWithRedirect(auth, provider);
    // a página recarrega e volta pro Google; o resultado é tratado abaixo, no getRedirectResult
  };

  // Trata o retorno do login por redirect (roda uma vez, quando a página volta do Google)
  getRedirectResult(auth).catch((e) => {
    console.error('Erro login Google (redirect):', e);
    const erroEl = document.getElementById('login-erro');
    if (erroEl) {
      erroEl.textContent = 'Erro: ' + (e.code || e.message);
      erroEl.style.display = 'block';
    }
  });

  window.fazerLogout = async () => {
    if (!confirm('Sair da conta?')) return;
    await signOut(auth);
  };

  // Interruptor temporário: coloque true de novo quando terminar de ajustar o login.
  const LOGIN_ATIVO = false;

  onAuthStateChanged(auth, (user) => {
    const tela = document.getElementById('tela-login');
    const appRoot = document.getElementById('app-root');
    if (!LOGIN_ATIVO || user) {
      tela.classList.remove('open');
      appRoot.style.display = 'block';
      iniciarApp();
    } else {
      tela.classList.add('open');
      appRoot.style.display = 'none';
    }
  });

  // ===== ESTADO =====
  let mesAtual = new Date().getMonth();
  let anoAtual = new Date().getFullYear();
  let tipoContaSelecionado = 'fixa';
  let tipoLancSelecionado = 'entrada';
  let filtroContas = 'todas';
  let filtroLanc = 'todos';
  let dadosContas = {};
  let dadosLanc = {};
  let saldoGlobal = { disponivel: 0, pct: 0 };

  const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
                 'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  // ===== EXPOR FUNÇÕES GLOBAIS =====
  window.mudarMes = (dir) => {
    mesAtual += dir;
    if (mesAtual > 11) { mesAtual = 0; anoAtual++; }
    if (mesAtual < 0) { mesAtual = 11; anoAtual--; }
    atualizarLabel();
    carregarDados(); // <-- era só renderizarTudo(); por isso não recarregava os dados do mês novo
  };

  window.showPage = (page, el) => {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('page-' + page).classList.add('active');
    el.classList.add('active');
    // Mostrar FAB apenas no dashboard
    const fab = document.getElementById('fab-btn');
    if (fab) fab.classList.toggle('visible', page === 'home');
    renderizarTudo();
  };

  window.abrirModal = (tipo, id) => {
    if (tipo === 'conta') {
      document.getElementById('modal-conta-title').textContent = id ? 'Editar Conta' : 'Nova Conta a Pagar';
      document.getElementById('conta-id').value = id || '';
      if (id && dadosContas[id]) {
        const c = dadosContas[id];
        document.getElementById('conta-nome').value = c.nome || '';
        document.getElementById('conta-valor').value = c.valor || '';
        document.getElementById('conta-categoria').value = c.categoria || 'outros';
        document.getElementById('conta-obs').value = c.obs || '';
        document.getElementById('conta-dia').value = c.dia || '';
        document.getElementById('conta-parcela-atual').value = c.parcelaAtual || '';
        document.getElementById('conta-total-parcelas').value = c.totalParcelas || '';
        document.getElementById('conta-dia-parcela').value = c.diaParcela || '';
        document.getElementById('conta-data-venc').value = c.dataVenc || '';
        selecionarTipoPorValor(c.tipo);
      } else {
        limparFormConta();
      }
      document.getElementById('modal-conta').classList.add('open');
    } else {
      document.getElementById('modal-lanc-title').textContent = id ? 'Editar Lançamento' : 'Novo Lançamento';
      document.getElementById('lanc-id').value = id || '';
      if (id && dadosLanc[id]) {
        const l = dadosLanc[id];
        document.getElementById('lanc-desc').value = l.desc || '';
        document.getElementById('lanc-valor').value = l.valor || '';
        document.getElementById('lanc-data').value = l.data || '';
        document.getElementById('lanc-quem').value = l.quem || 'Bruno';
        document.getElementById('lanc-categoria').value = l.categoria || 'outros';
        selecionarTipoLancPorValor(l.tipo);
      } else {
        limparFormLanc();
      }
      document.getElementById('modal-lancamento').classList.add('open');
    }
  };

  window.fecharModal = (tipo) => {
    document.getElementById('modal-' + tipo).classList.remove('open');
  };

  window.selecionarTipo = (tipo, el) => {
    tipoContaSelecionado = tipo;
    document.querySelectorAll('#modal-conta .tipo-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    document.querySelectorAll('.conditional').forEach(c => {
      if (!c.id.startsWith('cond-')) return;
      c.classList.remove('show');
    });
    const cond = document.getElementById('cond-' + tipo);
    if (cond) cond.classList.add('show');
  };

  window.selecionarTipoLanc = (tipo, el) => {
    tipoLancSelecionado = tipo;
    document.querySelectorAll('#modal-lancamento .tipo-btn').forEach(b => {
      b.classList.remove('active');
      b.style.borderColor = '';
      b.style.background = '';
      b.style.color = '';
    });
    el.classList.add('active');
    if (tipo === 'entrada') {
      el.style.borderColor = 'var(--green)';
      el.style.background = 'var(--green-bg)';
      el.style.color = 'var(--green)';
    } else {
      el.style.borderColor = 'var(--red)';
      el.style.background = 'var(--red-bg)';
      el.style.color = 'var(--red)';
    }
  };

  window.filtrarContas = (filtro, el) => {
    filtroContas = filtro;
    document.querySelectorAll('#page-contas .tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    renderizarContas();
  };

  window.filtrarLancamentos = (filtro, el) => {
    filtroLanc = filtro;
    document.querySelectorAll('#page-lancamentos .tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    renderizarLancamentos();
  };

  window.salvarConta = async () => {
    const nome = document.getElementById('conta-nome').value.trim();
    const valor = parseFloat(document.getElementById('conta-valor').value);
    if (!nome || isNaN(valor) || valor <= 0) {
      alert('Preencha nome e valor corretamente!');
      return;
    }

    const conta = {
      nome,
      valor,
      categoria: document.getElementById('conta-categoria').value,
      tipo: tipoContaSelecionado,
      obs: document.getElementById('conta-obs').value.trim(),
      pago: false,
      mes: mesAtual,
      ano: anoAtual
    };

    if (tipoContaSelecionado === 'fixa') {
      conta.dia = parseInt(document.getElementById('conta-dia').value) || 1;
    } else if (tipoContaSelecionado === 'parcelada') {
      conta.parcelaAtual = parseInt(document.getElementById('conta-parcela-atual').value) || 1;
      conta.totalParcelas = parseInt(document.getElementById('conta-total-parcelas').value) || 1;
      conta.diaParcela = parseInt(document.getElementById('conta-dia-parcela').value) || 1;
    } else {
      conta.dataVenc = document.getElementById('conta-data-venc').value;
    }

    const id = document.getElementById('conta-id').value;
    const path = `contas/${anoAtual}/${mesAtual}`;

    if (id) {
      await update(ref(db, `${path}/${id}`), conta);
    } else {
      await push(ref(db, path), conta);
    }

    fecharModal('conta');
    carregarDados();
  };

  window.salvarLancamento = async () => {
    const desc = document.getElementById('lanc-desc').value.trim();
    const valor = parseFloat(document.getElementById('lanc-valor').value);
    if (!desc || isNaN(valor) || valor <= 0) {
      alert('Preencha descrição e valor corretamente!');
      return;
    }

    const lanc = {
      desc,
      valor,
      tipo: tipoLancSelecionado,
      data: document.getElementById('lanc-data').value,
      quem: document.getElementById('lanc-quem').value,
      categoria: document.getElementById('lanc-categoria').value,
      mes: mesAtual,
      ano: anoAtual
    };

    const id = document.getElementById('lanc-id').value;
    const path = `lancamentos/${anoAtual}/${mesAtual}`;

    if (id) {
      await update(ref(db, `${path}/${id}`), lanc);
    } else {
      await push(ref(db, path), lanc);
    }

    fecharModal('lancamento');
    carregarDados();
  };

  window.togglePago = async (id) => {
    const conta = dadosContas[id];
    if (!conta) return;
    await update(ref(db, `contas/${anoAtual}/${mesAtual}/${id}`), {
      pago: !conta.pago
    });
    carregarDados();
  };

  window.excluirConta = async (id) => {
    if (!confirm('Excluir esta conta?')) return;
    await remove(ref(db, `contas/${anoAtual}/${mesAtual}/${id}`));
    carregarDados();
  };

  window.excluirLanc = async (id) => {
    if (!confirm('Excluir este lançamento?')) return;
    await remove(ref(db, `lancamentos/${anoAtual}/${mesAtual}/${id}`));
    carregarDados();
  };

  // ===== HELPERS =====
  const fmt = (v) => 'R$ ' + parseFloat(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2 });

  function getVencimento(conta) {
    const hoje = new Date();
    if (conta.tipo === 'esporadica' && conta.dataVenc) return new Date(conta.dataVenc + 'T12:00:00');
    const dia = conta.dia || conta.diaParcela || 1;
    return new Date(anoAtual, mesAtual, dia);
  }

  function getStatus(conta) {
    if (conta.pago) return 'pago';
    const venc = getVencimento(conta);
    const hoje = new Date();
    hoje.setHours(0,0,0,0);
    if (venc < hoje) return 'atrasado';
    const diff = (venc - hoje) / (1000 * 60 * 60 * 24);
    if (diff <= 7) return 'proximo';
    return 'pendente';
  }

  function catIcon(cat) {
    const icons = {
      moradia:'🏠',alimentacao:'🍔',saude:'💊',transporte:'🚗',
      educacao:'📚',lazer:'🎮',servicos:'📱',emprestimo:'💰',
      cartao:'💳',salario:'💵',beneficio:'🎁',extra:'💼',outros:'📦'
    };
    return icons[cat] || '📦';
  }

  function selecionarTipoPorValor(tipo) {
    tipoContaSelecionado = tipo || 'fixa';
    document.querySelectorAll('#modal-conta .tipo-btn').forEach(b => {
      if (b.textContent.toLowerCase().includes(tipoContaSelecionado === 'fixa' ? 'fixa' : tipoContaSelecionado === 'parcelada' ? 'parcel' : 'espor')) {
        b.classList.add('active');
      } else {
        b.classList.remove('active');
      }
    });
    document.querySelectorAll('[id^="cond-"]').forEach(c => c.classList.remove('show'));
    const cond = document.getElementById('cond-' + tipoContaSelecionado);
    if (cond) cond.classList.add('show');
  }

  function selecionarTipoLancPorValor(tipo) {
    tipoLancSelecionado = tipo || 'entrada';
    document.querySelectorAll('#modal-lancamento .tipo-btn').forEach(b => {
      b.classList.remove('active');
      b.style.borderColor = '';
      b.style.background = '';
      b.style.color = '';
    });
    const btns = document.querySelectorAll('#modal-lancamento .tipo-btn');
    const btn = tipoLancSelecionado === 'entrada' ? btns[0] : btns[1];
    if (btn) {
      btn.classList.add('active');
      btn.style.borderColor = tipoLancSelecionado === 'entrada' ? 'var(--green)' : 'var(--red)';
      btn.style.background = tipoLancSelecionado === 'entrada' ? 'var(--green-bg)' : 'var(--red-bg)';
      btn.style.color = tipoLancSelecionado === 'entrada' ? 'var(--green)' : 'var(--red)';
    }
  }

  function limparFormConta() {
    ['conta-nome','conta-valor','conta-obs','conta-dia','conta-parcela-atual',
     'conta-total-parcelas','conta-dia-parcela','conta-data-venc'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
    tipoContaSelecionado = 'fixa';
    document.querySelectorAll('#modal-conta .tipo-btn').forEach((b,i) => {
      b.classList.toggle('active', i === 0);
    });
    document.querySelectorAll('[id^="cond-"]').forEach(c => c.classList.remove('show'));
    document.getElementById('cond-fixa').classList.add('show');
  }

  function limparFormLanc() {
    document.getElementById('lanc-desc').value = '';
    document.getElementById('lanc-valor').value = '';
    document.getElementById('lanc-data').value = new Date().toISOString().split('T')[0];
    document.getElementById('lanc-quem').value = 'Bruno';
    document.getElementById('lanc-categoria').value = 'salario';
    tipoLancSelecionado = 'entrada';
    const btns = document.querySelectorAll('#modal-lancamento .tipo-btn');
    btns.forEach(b => { b.classList.remove('active'); b.style.cssText = ''; });
    if (btns[0]) {
      btns[0].classList.add('active');
      btns[0].style.borderColor = 'var(--green)';
      btns[0].style.background = 'var(--green-bg)';
      btns[0].style.color = 'var(--green)';
    }
  }

  // ===== CARREGAR DADOS =====
  async function carregarDados() {
    const [snapContas, snapLanc, snapContasTudo, snapLancTudo] = await Promise.all([
      get(ref(db, `contas/${anoAtual}/${mesAtual}`)),
      get(ref(db, `lancamentos/${anoAtual}/${mesAtual}`)),
      get(ref(db, 'contas')),
      get(ref(db, 'lancamentos'))
    ]);
    dadosContas = snapContas.exists() ? snapContas.val() : {};
    dadosLanc = snapLanc.exists() ? snapLanc.val() : {};
    saldoGlobal = calcularSaldoGlobal(
      snapContasTudo.exists() ? snapContasTudo.val() : {},
      snapLancTudo.exists() ? snapLancTudo.val() : {}
    );
    renderizarTudo();
  }

  // Percorre contas/{ano}/{mes}/{id} e lancamentos/{ano}/{mes}/{id} de TODOS os meses
  // e soma tudo, pra dar o saldo total acumulado (não só do mês em exibição).
  function calcularSaldoGlobal(todasContas, todosLancs) {
    let totalEntradas = 0, totalSaidas = 0, totalPago = 0, totalPendente = 0, totalContas = 0;

    Object.values(todosLancs || {}).forEach(mesesDoAno => {
      Object.values(mesesDoAno || {}).forEach(lancsDoMes => {
        Object.values(lancsDoMes || {}).forEach(l => {
          if (l.tipo === 'entrada') totalEntradas += l.valor;
          if (l.tipo === 'saida') totalSaidas += l.valor;
        });
      });
    });

    Object.values(todasContas || {}).forEach(mesesDoAno => {
      Object.values(mesesDoAno || {}).forEach(contasDoMes => {
        Object.values(contasDoMes || {}).forEach(c => {
          totalContas += c.valor;
          if (c.pago) totalPago += c.valor; else totalPendente += c.valor;
        });
      });
    });

    const disponivel = (totalEntradas - totalSaidas - totalPago) - totalPendente;
    const pct = totalContas > 0 ? Math.min(100, (totalPago / totalContas) * 100) : 0;
    return { disponivel, pct };
  }

  // ===== RENDERIZAR =====
  function atualizarLabel() {
    document.getElementById('monthLabel').textContent = `${meses[mesAtual]} ${anoAtual}`;
  }

  function renderizarTudo() {
    const page = document.querySelector('.page.active').id;
    if (page === 'page-home') renderizarHome();
    if (page === 'page-contas') renderizarContas();
    if (page === 'page-lancamentos') renderizarLancamentos();
    if (page === 'page-analise') renderizarAnalise();
  }

  function renderizarHome() {
    const contas = Object.entries(dadosContas);
    const lancs = Object.entries(dadosLanc);

    const totalEntradas = lancs.filter(([,l]) => l.tipo === 'entrada').reduce((s,[,l]) => s + l.valor, 0);
    const totalSaidas = lancs.filter(([,l]) => l.tipo === 'saida').reduce((s,[,l]) => s + l.valor, 0);
    const totalContas = contas.reduce((s,[,c]) => s + c.valor, 0);
    const totalPago = contas.filter(([,c]) => c.pago).reduce((s,[,c]) => s + c.valor, 0);
    const totalPendente = contas.filter(([,c]) => !c.pago).reduce((s,[,c]) => s + c.valor, 0);
    const atrasadas = contas.filter(([,c]) => getStatus(c) === 'atrasado');
    const proximas = contas.filter(([,c]) => getStatus(c) === 'proximo');
    const saldo = totalEntradas - totalSaidas - totalPago;
    const disponivel = saldoGlobal.disponivel; // acumulado de todos os meses
    const pct = saldoGlobal.pct; // % de contas pagas, também acumulado

    let html = '';

    if (atrasadas.length > 0) {
      html += `<div class="alert-banner">⚠️ Você tem ${atrasadas.length} conta(s) atrasada(s)! Verifique a aba Contas.</div>`;
    }

    html += `
      <div class="summary-grid">
        <div class="summary-card full">
          <div class="label">💰 Saldo Disponível</div>
          <div class="value ${disponivel >= 0 ? 'blue' : 'red'}">${fmt(disponivel)}</div>
          <div class="sub">Após pagar todas as contas pendentes</div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="sub" style="margin-top:6px">${pct.toFixed(0)}% das contas pagas</div>
        </div>
        <div class="summary-card">
          <div class="label">⬆️ Entradas</div>
          <div class="value green">${fmt(totalEntradas)}</div>
        </div>
        <div class="summary-card">
          <div class="label">⬇️ Saídas</div>
          <div class="value red">${fmt(totalSaidas)}</div>
        </div>
        <div class="summary-card">
          <div class="label">✅ Contas Pagas</div>
          <div class="value green">${fmt(totalPago)}</div>
        </div>
        <div class="summary-card">
          <div class="label">⏳ A Pagar</div>
          <div class="value orange">${fmt(totalPendente)}</div>
        </div>
      </div>
    `;

    if (proximas.length > 0) {
      html += `<div class="section">
        <div class="section-header">
          <div class="section-title">⚠️ Vencem em breve <span class="badge orange">${proximas.length}</span></div>
        </div>`;
      proximas.forEach(([id, c]) => {
        const venc = getVencimento(c);
        const dias = Math.ceil((venc - new Date()) / (1000 * 60 * 60 * 24));
        html += `<div class="item-card">
          <div class="item-info">
            <div class="item-name">${catIcon(c.categoria)} ${c.nome}</div>
            <div class="item-meta">Vence em ${dias} dia(s)</div>
          </div>
          <div class="item-value orange">${fmt(c.valor)}</div>
        </div>`;
      });
      html += `</div>`;
    }

    if (atrasadas.length > 0) {
      html += `<div class="section">
        <div class="section-header">
          <div class="section-title">🔴 Atrasadas <span class="badge">${atrasadas.length}</span></div>
        </div>`;
      atrasadas.forEach(([id, c]) => {
        html += `<div class="item-card">
          <div class="item-info">
            <div class="item-name">${catIcon(c.categoria)} ${c.nome}</div>
            <div class="item-meta" style="color:var(--red)">Em atraso!</div>
          </div>
          <div class="item-value red">${fmt(c.valor)}</div>
        </div>`;
      });
      html += `</div>`;
    }

    if (contas.length === 0 && lancs.length === 0) {
      html += `<div class="empty">
        <div class="icon">📊</div>
        <div>Nenhum dado ainda em ${meses[mesAtual]}.</div>
        <div style="margin-top:8px">Adicione suas contas e lançamentos!</div>
      </div>`;
    }

    document.getElementById('home-content').innerHTML = html;
  }

  function renderizarContas() {
    let contas = Object.entries(dadosContas);

    if (filtroContas === 'pendente') contas = contas.filter(([,c]) => !c.pago && getStatus(c) !== 'atrasado');
    else if (filtroContas === 'pago') contas = contas.filter(([,c]) => c.pago);
    else if (filtroContas === 'atrasado') contas = contas.filter(([,c]) => getStatus(c) === 'atrasado');

    if (contas.length === 0) {
      document.getElementById('contas-content').innerHTML = `
        <div class="empty"><div class="icon">💳</div><div>Nenhuma conta encontrada.</div></div>`;
      return;
    }

    // Ordenar: atrasadas primeiro, depois por vencimento
    contas.sort(([,a],[,b]) => {
      const sa = getStatus(a) === 'atrasado' ? -1 : 0;
      const sb = getStatus(b) === 'atrasado' ? -1 : 0;
      if (sa !== sb) return sa - sb;
      return getVencimento(a) - getVencimento(b);
    });

    let html = contas.map(([id, c]) => {
      const status = getStatus(c);
      const venc = getVencimento(c);
      const diaStr = venc ? `Vence dia ${venc.getDate()}/${String(venc.getMonth()+1).padStart(2,'0')}` : '';
      const parcelaStr = c.tipo === 'parcelada' ? ` • ${c.parcelaAtual}/${c.totalParcelas}` : '';

      let tagHtml = `<span class="tag ${c.tipo}">${c.tipo === 'fixa' ? 'Fixa' : c.tipo === 'parcelada' ? 'Parcelada' : 'Esporádica'}</span>`;
      if (status === 'atrasado') tagHtml += `<span class="tag atrasado">Atrasada</span>`;

      return `<div class="item-card">
        <div class="item-check ${c.pago ? 'checked' : ''}" onclick="togglePago('${id}')"></div>
        <div class="item-info">
          <div class="item-name ${c.pago ? 'paid' : ''}">${catIcon(c.categoria)} ${c.nome}</div>
          <div class="item-meta">${diaStr}${parcelaStr}${c.obs ? ' • ' + c.obs : ''}</div>
          <div class="item-tags">${tagHtml}</div>
        </div>
        <div class="item-value ${c.pago ? 'paid' : status === 'atrasado' ? 'red' : ''}">${fmt(c.valor)}</div>
        <div class="item-actions">
          <button class="btn-icon" onclick="abrirModal('conta','${id}')">✏️</button>
          <button class="btn-icon" onclick="excluirConta('${id}')">🗑️</button>
        </div>
      </div>`;
    }).join('');

    document.getElementById('contas-content').innerHTML = html;
  }

  function renderizarLancamentos() {
    let lancs = Object.entries(dadosLanc);

    if (filtroLanc === 'entrada') lancs = lancs.filter(([,l]) => l.tipo === 'entrada');
    else if (filtroLanc === 'saida') lancs = lancs.filter(([,l]) => l.tipo === 'saida');

    lancs.sort(([,a],[,b]) => (b.data || '').localeCompare(a.data || ''));

    if (lancs.length === 0) {
      document.getElementById('lancamentos-content').innerHTML = `
        <div class="empty"><div class="icon">💸</div><div>Nenhum lançamento encontrado.</div></div>`;
      return;
    }

    let html = lancs.map(([id, l]) => {
      const isEntrada = l.tipo === 'entrada';
      const dataStr = l.data ? new Date(l.data + 'T12:00:00').toLocaleDateString('pt-BR') : '';
      return `<div class="entrada-card">
        <div class="entrada-icon ${isEntrada ? '' : 'saida'}">${catIcon(l.categoria)}</div>
        <div class="item-info">
          <div class="item-name">${l.desc}</div>
          <div class="item-meta">${dataStr ? dataStr + ' • ' : ''}${l.quem}</div>
        </div>
        <div class="item-value ${isEntrada ? 'green' : 'red'}">${isEntrada ? '+' : '-'}${fmt(l.valor)}</div>
        <div class="item-actions">
          <button class="btn-icon" onclick="abrirModal('lancamento','${id}')">✏️</button>
          <button class="btn-icon" onclick="excluirLanc('${id}')">🗑️</button>
        </div>
      </div>`;
    }).join('');

    document.getElementById('lancamentos-content').innerHTML = html;
  }

  function renderizarAnalise() {
    const contas = Object.entries(dadosContas);
    const lancs = Object.entries(dadosLanc);

    const totalEntradas = lancs.filter(([,l]) => l.tipo === 'entrada').reduce((s,[,l]) => s + l.valor, 0);
    const totalSaidas = lancs.filter(([,l]) => l.tipo === 'saida').reduce((s,[,l]) => s + l.valor, 0);
    const totalContas = contas.reduce((s,[,c]) => s + c.valor, 0);
    const totalPago = contas.filter(([,c]) => c.pago).reduce((s,[,c]) => s + c.valor, 0);
    const totalPendente = contas.filter(([,c]) => !c.pago).reduce((s,[,c]) => s + c.valor, 0);

    // Agrupar contas por categoria
    const porCat = {};
    contas.forEach(([,c]) => {
      if (!porCat[c.categoria]) porCat[c.categoria] = 0;
      porCat[c.categoria] += c.valor;
    });
    const catOrdenadas = Object.entries(porCat).sort(([,a],[,b]) => b - a);
    const totalCat = Object.values(porCat).reduce((s,v) => s + v, 0);

    let catHtml = catOrdenadas.map(([cat, val]) => {
      const pct = totalCat > 0 ? (val / totalCat * 100).toFixed(0) : 0;
      return `<div style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px">
          <span style="font-size:13px;font-weight:500">${catIcon(cat)} ${cat}</span>
          <span style="font-size:13px;font-weight:600">${fmt(val)} (${pct}%)</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width:${pct}%;background:var(--blue)"></div>
        </div>
      </div>`;
    }).join('');

    const html = `
      <div class="section">
        <div class="section-title" style="margin-bottom:12px">📊 Resumo de ${meses[mesAtual]}</div>
        <div class="summary-grid">
          <div class="summary-card">
            <div class="label">Entradas</div>
            <div class="value green">${fmt(totalEntradas)}</div>
          </div>
          <div class="summary-card">
            <div class="label">Saídas</div>
            <div class="value red">${fmt(totalSaidas)}</div>
          </div>
          <div class="summary-card">
            <div class="label">Contas Pagas</div>
            <div class="value green">${fmt(totalPago)}</div>
          </div>
          <div class="summary-card">
            <div class="label">A Pagar</div>
            <div class="value orange">${fmt(totalPendente)}</div>
          </div>
          <div class="summary-card full">
            <div class="label">Total de Contas no Mês</div>
            <div class="value blue">${fmt(totalContas)}</div>
            <div class="sub">${contas.length} conta(s) cadastrada(s)</div>
          </div>
        </div>
      </div>
      <div class="section">
        <div class="section-title" style="margin-bottom:12px">🏷️ Contas por Categoria</div>
        <div class="summary-card">
          ${catHtml || '<div class="empty"><div>Nenhum dado ainda.</div></div>'}
        </div>
      </div>
    `;

    document.getElementById('analise-content').innerHTML = html;
  }

  // ===== INIT (roda só depois do login) =====
  let appJaIniciado = false;
  function iniciarApp() {
    if (appJaIniciado) return; // evita reiniciar tudo se o Firebase disparar onAuthStateChanged de novo
    appJaIniciado = true;

    atualizarLabel();
    carregarDados();
    // Mostrar FAB na tela inicial
    const fab = document.getElementById('fab-btn');
    if (fab) fab.classList.add('visible');

    // Fechar modal clicando fora (só os modais do app, não a tela de login)
    document.querySelectorAll('#app-root .modal-overlay').forEach(el => {
      el.addEventListener('click', (e) => {
        if (e.target === el) {
          el.classList.remove('open');
        }
      });
    });
  }
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/dashboard-financeiro/sw.js', { scope: '/dashboard-financeiro/' })
        .then(reg => console.log('SW registrado OK:', reg.scope))
        .catch(err => console.error('SW erro:', err));
    });
  }
</script>
